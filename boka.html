  .booking-form {

    border-radius: 15px;
    border: 4px solid goldenrod;
    box-sizing: border-box;
     transition: 0.3s ease;
  }
     .booking-form:hover {
        box-shadow: 0 0 20px black;
        border: 4px solid #fbecc1;
        background: goldenrod;
        transform: scale(1.03);
   }
    
        .btn-gold:hover{
            background: #fbecc1;
        }

 </div>
   
    <main>
   <h1 style="text-align:center; color: black; margin:40px; font-weight: bold;">BOOK A TABLE</h1>
   <form class="booking-form">
   
    <label style=" font-weight: bold;">Name</label> <br>
    <input type="text" id="name" name="name" placeholder="Enter your name" required style="width:90%; padding: 15px; margin:8px 0 15px;  font-weight: bold"><br>

    <label style="font-weight: bold;">Email</label><br>
    <input type="email"  id="email" name="email" placeholder="Enter your email" required style="width:90%; padding:15px; margin:8px 0 15px;  font-weight: bold;"><br>

    <label style="font-weight: bold;">Phone</label><br>
    <input type="tel"  id="phone" name="phone" placeholder="Enter your phone number" required style="width:90%; padding:15px; margin:8px 0 15px;  font-weight: bold;"><br>

    <label style="font-weight: bold;">Date</label><br>
    <input type="date" id="date" name="date" required style="width:90%; padding:15px; margin:8px 0 15px;  font-weight: bold;"><br>
    
     <label style="font-weight: bold;">Time</label><br>
    <input type="time"  id="time" name="time" required style="width:90%; padding:15px; margin:8px 0 15px;  font-weight: bold;"><br>
                   
    <label>Number of Guests</label><br>
    <input type="number" id="guests" name="guests" min="1" placeholder="Number of guests" required style="width:90%; padding:15px; margin:8px 0 15px; font-weight: bold;"><br>

    <label>Message</label><br>
    <textarea id="message" name="message" placeholder="Special request" style="width:90%; padding:15px; margin:8px 0 15px; font-weight: bold;"></textarea><br>

    <button type="submit" class="btn-gold" style="border: 2px solid black; cursor:pointer; padding: 12px;font-weight: bold;"> RESERVE TABLE </button>
   </form>
   </main>
